name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          API_ROOT: ${{ vars.VITE_API_URL || 'https://wwngo.com/backend' }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
        run: |
          # Admin portal calls <backend>/api/v1; accept the variable with or without that suffix.
          export VITE_API_URL="${API_ROOT%/}"
          case "$VITE_API_URL" in */api/v1) ;; *) VITE_API_URL="$VITE_API_URL/api/v1" ;; esac
          echo "VITE_API_URL=$VITE_API_URL"
          npm run build

      - name: Upload to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
