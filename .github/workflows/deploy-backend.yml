name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || 'wwngo.com' }}
      SSH_USER: ${{ vars.SSH_USER || 'wwngo' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      APP_DIR: ${{ vars.BACKEND_APP_DIR || 'wwngo-backend' }}
      APP_PORT: ${{ vars.BACKEND_PORT || '5055' }}
      PROXY_DIR: ${{ vars.BACKEND_PROXY_DIR || 'public_html/backend' }}
      PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL || 'https://wwngo.com/backend' }}

    steps:
      - uses: actions/checkout@v4

      - name: Write production .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGIN || 'https://wwngo.com,https://www.wwngo.com' }}
          WATI_API_KEY: ${{ secrets.WATI_API_KEY }}
          WATI_NOTIFY_TO: ${{ vars.WATI_NOTIFY_TO }}
          # Optional: if not set here, deploy.sh generates JWT secrets once and keeps them on the server.
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_RESET_SECRET: ${{ secrets.JWT_RESET_SECRET }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL is not set"; exit 1; fi
          umask 077
          {
            echo "NODE_ENV=production"
            echo "HOST=127.0.0.1"
            echo "PORT=$APP_PORT"
            echo "APP_PUBLIC_URL=$PUBLIC_URL"
            # Only non-empty values, so server-side settings (deploy.sh) can fill the rest.
            for key in DATABASE_URL CORS_ORIGINS WATI_API_KEY WATI_NOTIFY_TO \
                       JWT_ACCESS_SECRET JWT_REFRESH_SECRET JWT_RESET_SECRET \
                       ADMIN_SEED_EMAIL ADMIN_SEED_PASSWORD SMTP_USER SMTP_PASS \
                       STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET GOOGLE_MAPS_API_KEY; do
              if [ -n "${!key}" ]; then printf '%s=%s\n' "$key" "${!key}"; fi
            done
          } > backend/.env

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "::error::Secret SSH_PRIVATE_KEY is not set"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload backend
        run: |
          ssh deploy-target "mkdir -p '$APP_DIR' && find '$APP_DIR' -mindepth 1 -maxdepth 1 ! -name node_modules ! -name uploads ! -name 'serviceAccount*.json' -exec rm -rf {} +"
          tar -czf - -C backend --exclude=node_modules --exclude=uploads --exclude='*.log' . | ssh deploy-target "tar -xzf - -C '$APP_DIR'"

      - name: Install, migrate and restart
        run: ssh deploy-target "cd '$APP_DIR' && PORT='$APP_PORT' PROXY_DIR='$PROXY_DIR' bash scripts/deploy.sh"

      - name: Check public URL
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/api/health"
